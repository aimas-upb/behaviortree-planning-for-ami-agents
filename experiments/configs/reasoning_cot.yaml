experiment:
  name: reasoning_cot
  description: Chain-of-thought reasoning before JSON IR generation

discovery:
  affordances:
    strategy: exhaustive
    max_workspaces: 10
  state:
    strategy: all  # Gather all state for reasoning

planning:
  reasoning:
    enabled: true
    strategy: chain_of_thought
    max_turns: 3
  output:
    format: json_ir
  prompt_strategy: detailed

execution:
  max_ticks: 10

model:
  name: gpt-4o
  temperature: 0.0

tracing:
  enabled: true
  output_dir: traces/
  verbose: false
