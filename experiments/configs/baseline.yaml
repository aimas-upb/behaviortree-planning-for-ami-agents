experiment:
  name: baseline
  description: Baseline configuration - exhaustive discovery, no reasoning, JSON IR output

discovery:
  affordances:
    strategy: exhaustive
    max_workspaces: 10
  state:
    strategy: none

planning:
  reasoning:
    enabled: false
    strategy: chain_of_thought
    max_turns: 3
  output:
    format: json_ir
  prompt_strategy: detailed

execution:
  max_ticks: 10

model:
  name: gpt-4o
  temperature: 0.0

tracing:
  enabled: true
  output_dir: traces/
  verbose: false
