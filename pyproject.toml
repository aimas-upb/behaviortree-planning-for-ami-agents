[project]
name = "ami-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "py-trees>=2.4.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "rdflib>=7.5.0",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
    "rich>=13.0.0",
    "fastembed>=0.4.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 80
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
  | \.env
  | \.flake8
)/
'''

[tool.isort]
profile = "black"
line_length = 80
src_paths = ["src", "scripts"]
