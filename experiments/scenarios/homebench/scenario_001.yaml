scenario:
  id: "001"
  name: "Turn on bathroom light"
  description: "Simple single-device control task"

environment:
  home: 0
  entry_point: "http://localhost:8080/workspaces/home0#workspace"

task:
  goal: "Turn on the bathroom light"

expected_outcome:
  success: true
  artifacts_modified:
    - "bathroomLight"
  final_state:
    "http://localhost:8080/workspaces/home0/bathroom/artifacts/bathroomLight/properties/state": "on"

tags:
  - single_device
  - simple
  - turn_on
