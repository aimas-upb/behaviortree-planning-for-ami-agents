experiment:
  name: agentic_query_discovery
  description: LLM-guided agentic discovery with SPARQL query generation

discovery:
  affordances:
    strategy: agentic_query
    max_workspaces: 10
  state:
    strategy: relevant  # Only gather relevant state

planning:
  reasoning:
    enabled: false
    strategy: chain_of_thought
    max_turns: 3
  output:
    format: python_code_unconstrained
  prompt_strategy: detailed

execution:
  max_ticks: 10

model:
  name: gpt-5-mini
  temperature: 1.0
  reasoning_effort: low

tracing:
  enabled: true
  output_dir: traces/
  verbose: true
