experiment:
  name: reasoning_multi_turn
  description: Multi-turn reasoning exploration before JSON IR generation

discovery:
  affordances:
    strategy: exhaustive
    max_workspaces: 10
  state:
    strategy: all

planning:
  reasoning:
    enabled: true
    strategy: multi_turn
    max_turns: 5
  output:
    format: json_ir
  prompt_strategy: detailed

execution:
  max_ticks: 10

model:
  name: gpt-4o
  temperature: 0.0

tracing:
  enabled: true
  output_dir: traces/
  verbose: false
