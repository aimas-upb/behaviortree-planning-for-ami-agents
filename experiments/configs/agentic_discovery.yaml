experiment:
  name: agentic_discovery
  description: LLM-guided agentic discovery with JSON IR output

discovery:
  affordances:
    strategy: agentic
    max_workspaces: 10
  state:
    strategy: relevant  # Only gather relevant state

planning:
  reasoning:
    enabled: false
    strategy: chain_of_thought
    max_turns: 3
  output:
    format: json_ir
  prompt_strategy: detailed

execution:
  max_ticks: 10

model:
  name: gpt-4o
  temperature: 0.0

tracing:
  enabled: true
  output_dir: traces/
  verbose: false
